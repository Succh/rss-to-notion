# RSS to Notion 配置
# 通过 rss2json.com 代理抓取国内源（绕过 GFW）

rss_sources:
  # ========== 国内源（通过 rss2json 代理） ==========
  ithome:
    enabled: true
    name: IT之家
    url: https://www.ithome.com/rss/
    use_proxy: true

  sspaipad:
    enabled: true
    name: 少数派
    url: https://sspai.com/feed
    use_proxy: true

  tmtpost:
    enabled: true
    name: 钛媒体
    url: https://www.tmtpost.com/rss.xml
    use_proxy: true

  fuliba:
    enabled: true
    name: 福利吧
    url: https://www.fuliba2023.net/feed
    use_proxy: true

  # ========== 海外源（直接抓取） ==========
  hackernews:
    enabled: true
    name: Hacker News
    url: https://hnrss.org/frontpage
    use_proxy: false

  wanqu:
    enabled: true
    name: 湾区日报
    url: https://wanqu.co/feed/
    use_proxy: true

  theverge:
    enabled: true
    name: The Verge
    url: https://www.theverge.com/rss/index.xml
    use_proxy: false

settings:
  keep_days: 7
  max_items_per_run: 20
